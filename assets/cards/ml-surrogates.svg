<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" font-family="system-ui, sans-serif">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7aa2f7"/>
    </marker>
  </defs>
  <rect width="600" height="250" fill="#0e141c"/>

  <!-- left: field-solver mesh with two conductors -->
  <rect x="26" y="40" width="190" height="150" rx="8" fill="#0b0f14" stroke="#24324a"/>
  <g stroke="#1f2d42" stroke-width="1">
    <line x1="26" y1="70" x2="216" y2="70"/><line x1="26" y1="100" x2="216" y2="100"/>
    <line x1="26" y1="130" x2="216" y2="130"/><line x1="26" y1="160" x2="216" y2="160"/>
    <line x1="64" y1="40" x2="64" y2="190"/><line x1="102" y1="40" x2="102" y2="190"/>
    <line x1="140" y1="40" x2="140" y2="190"/><line x1="178" y1="40" x2="178" y2="190"/>
  </g>
  <!-- two conductors -->
  <rect x="58" y="112" width="42" height="18" rx="2" fill="#7aa2f7"/>
  <rect x="142" y="112" width="42" height="18" rx="2" fill="#e3b341"/>
  <!-- coupling field lines -->
  <g fill="none" stroke="#9dc1ff" stroke-width="1.2" opacity="0.7">
    <path d="M100,118 C118,100 126,100 142,118"/>
    <path d="M100,124 C118,138 126,138 142,124"/>
  </g>
  <text x="121" y="180" text-anchor="middle" fill="#9aa4b2" font-size="11" font-family="ui-monospace, monospace">field solver</text>

  <!-- arrow to the network -->
  <line x1="224" y1="115" x2="266" y2="115" stroke="#7aa2f7" stroke-width="1.8" marker-end="url(#b)"/>

  <!-- MLP surrogate -->
  <g stroke="#2a3a55" stroke-width="1">
    <line x1="300" y1="70" x2="370" y2="60"/><line x1="300" y1="70" x2="370" y2="105"/><line x1="300" y1="70" x2="370" y2="150"/><line x1="300" y1="70" x2="370" y2="195"/>
    <line x1="300" y1="115" x2="370" y2="60"/><line x1="300" y1="115" x2="370" y2="105"/><line x1="300" y1="115" x2="370" y2="150"/><line x1="300" y1="115" x2="370" y2="195"/>
    <line x1="300" y1="160" x2="370" y2="60"/><line x1="300" y1="160" x2="370" y2="105"/><line x1="300" y1="160" x2="370" y2="150"/><line x1="300" y1="160" x2="370" y2="195"/>
    <line x1="370" y1="60" x2="432" y2="115"/><line x1="370" y1="105" x2="432" y2="115"/><line x1="370" y1="150" x2="432" y2="115"/><line x1="370" y1="195" x2="432" y2="115"/>
  </g>
  <g fill="#111823" stroke="#7aa2f7" stroke-width="1.5">
    <circle cx="300" cy="70" r="9"/><circle cx="300" cy="115" r="9"/><circle cx="300" cy="160" r="9"/>
    <circle cx="370" cy="60" r="9"/><circle cx="370" cy="105" r="9"/><circle cx="370" cy="150" r="9"/><circle cx="370" cy="195" r="9"/>
    <circle cx="432" cy="115" r="9" fill="#17233a"/>
  </g>
  <text x="366" y="222" text-anchor="middle" fill="#9aa4b2" font-size="11" font-family="ui-monospace, monospace">PyTorch MLP</text>

  <!-- result badge -->
  <line x1="441" y1="115" x2="476" y2="115" stroke="#7aa2f7" stroke-width="1.8" marker-end="url(#b)"/>
  <rect x="478" y="86" width="100" height="58" rx="10" fill="#0e141c" stroke="#7ee787" stroke-width="1.5"/>
  <text x="528" y="116" text-anchor="middle" fill="#7ee787" font-size="21" font-weight="700">0.5 &#181;s</text>
  <text x="528" y="134" text-anchor="middle" fill="#b7c0cc" font-size="11">&#177;0.14%</text>
</svg>
